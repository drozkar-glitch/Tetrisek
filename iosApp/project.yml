name: iosApp
options:
  bundleIdPrefix: cz.mares
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_NAME: NeonoveKostky
        PRODUCT_BUNDLE_IDENTIFIER: cz.mares.tetrisek
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/bin/iosArm64/releaseFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
          - "-framework"
          - "ComposeApp"
          - "-lsqlite3"
